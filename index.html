            <div style="display:flex;gap:6px;align-items:center;margin-top:6px;">
              <input class="form-input em-name" data-id="${ex.id}" value="${esc(ex.name)}" style="flex:1;padding:6px 10px;font-size:13px;" />
              <button style="padding:6px 8px;color:var(--gym);background:transparent;border:0.5px solid var(--border);border-radius:6px;" onclick="window.__delEx('${ex.id}')"><i class="ti ti-trash" style="font-size:14px;"></i></button>
            </div>`).join('')}
          <button style="width:100%;margin-top:8px;padding:8px;font-size:12px;color:var(--gym);border:0.5px dashed var(--border);background:transparent;border-radius:8px;" onclick="window.__addExInGroup('${g.id}')"><i class="ti ti-plus"></i> Add exercise</button>
        </div>`
      }).join('')}
      <button style="width:100%;padding:12px;font-size:14px;color:var(--gym);border:0.5px dashed var(--border);background:transparent;border-radius:10px;" onclick="window.__addGroupInline()"><i class="ti ti-plus"></i> Add muscle group</button>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="window.__closeModal()">Cancel</button>
      <button class="btn-save gym" onclick="window.__saveGroups()">Save all changes</button>
    </div>`)

  window.__delGroup = async id => {
    if (!confirm('Delete this group and all its exercises + history?')) return
    await sb.from('muscle_groups').delete().eq('id', id)
    closeModal(); renderGym(root)
  }
  window.__delEx = async id => {
    if (!confirm('Delete this exercise and all its history?')) return
    await sb.from('exercises').delete().eq('id', id)
    closeModal(); openGroupsManager(root)
  }
  window.__addExInGroup = async gid => {
    const name = prompt('Exercise name?')
    if (!name?.trim()) return
    const list = state.gym.exercises[gid] || []
    const maxOrder = list.reduce((a,b)=>Math.max(a,b.sort_order||0),0)
    await sb.from('exercises').insert({ user_id: state.user.id, muscle_group_id: gid, name: name.trim(), sort_order: maxOrder+1 })
    closeModal()
    const gs2 = await sb.from('muscle_groups').select('*').order('sort_order')
    const exs2 = await sb.from('exercises').select('*').order('sort_order')
    state.gym.groups = gs2.data || []
    state.gym.exercises = {}
    ;(exs2.data || []).forEach(ex => { (state.gym.exercises[ex.muscle_group_id] ||= []).push(ex) })
    openGroupsManager(root)
  }
  window.__addGroupInline = async () => {
    const name = prompt('Group name?')
    if (!name?.trim()) return
    const maxOrder = state.gym.groups.reduce((a,b)=>Math.max(a,b.sort_order||0),0)
    await sb.from('muscle_groups').insert({ user_id: state.user.id, name: name.trim(), sort_order: maxOrder+1 })
    closeModal()
    renderGym(root)
  }
  window.__saveGroups = async () => {
    const gUpdates = [...document.querySelectorAll('.gm-name')].map(i => ({ id: i.dataset.id, name: i.value.trim() })).filter(x=>x.name)
    const eUpdates = [...document.querySelectorAll('.em-name')].map(i => ({ id: i.dataset.id, name: i.value.trim() })).filter(x=>x.name)
    for (const g of gUpdates) await sb.from('muscle_groups').update({ name: g.name }).eq('id', g.id)
    for (const e of eUpdates) await sb.from('exercises').update({ name: e.name }).eq('id', e.id)
    toast('Saved')
    closeModal()
    renderGym(root)
  }
}

function openLogWorkoutModal(root, { session, exerciseId, defaultDate } = {}) {
  const gid = state.gym.activeGroup
  const groups = state.gym.groups
  const exs = state.gym.exercises[gid] || []
  const editing = !!session
  const initialSets = editing
    ? [...(session.workout_sets || [])].sort((a,b) => a.set_number - b.set_number).map(s => ({ reps: s.reps, weight: Number(s.weight_kg) }))
    : [{ reps: 10, weight: 20 }]
  const initialDate = editing ? session.performed_on : (defaultDate || todayISO())
  const initialExId = exerciseId || session?.exercise_id || exs[0]?.id
  const initialNotes = session?.notes || ''
  const unit = state.weight.unit

  const state_ = { setsData: [...initialSets], exId: initialExId, gid, date: initialDate, notes: initialNotes }

  const renderModal = () => {
    const exsForGroup = state.gym.exercises[state_.gid] || []
    openModal(`
      <div class="modal-header">
        <div class="modal-close" onclick="window.__closeModal()"><i class="ti ti-x"></i></div>
        <div class="modal-title">${editing ? 'Edit workout' : 'Log workout'}</div>
        <div style="width:20px"></div>
      </div>
      <div class="modal-body">

        <div style="font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:6px;">Muscle group</div>
        <div class="section-pills" style="margin-bottom:14px;">
          ${groups.map(g => `<span class="lg-group" data-id="${g.id}" style="padding:7px 14px;font-size:13px;border:0.5px solid var(--border);border-radius:999px;cursor:pointer;${g.id===state_.gid?'background:var(--gym);color:white;font-weight:500;border-color:var(--gym);':''}">${esc(g.name)}</span>`).join('')}
        </div>

        <div style="font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:6px;">Exercise</div>
        <select class="form-input" id="lg-ex" style="margin-bottom:14px;">
          ${exsForGroup.map(ex => `<option value="${ex.id}" ${ex.id === state_.exId ? 'selected' : ''}>${esc(ex.name)}</option>`).join('')}
        </select>

        <div style="font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:6px;">Date</div>
        <input class="form-input" type="date" id="lg-date" value="${state_.date}" max="${todayISO()}" style="margin-bottom:14px;" />

        <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:8px;">
          <span>Sets</span><span style="color:var(--text-muted);font-weight:400;">sets × reps (weight)</span>
        </div>

        <div style="display:grid;grid-template-columns:32px 1fr 1fr 32px;gap:8px;align-items:center;margin-bottom:8px;font-size:11px;color:var(--text-muted);padding:0 4px;">
          <div>#</div><div>Reps</div><div>Weight (${unit})</div><div></div>
        </div>

        <div id="lg-sets"></div>

        <button type="button" id="lg-addset" style="width:100%;padding:10px;font-size:13px;border:0.5px dashed var(--border);background:transparent;border-radius:10px;color:var(--text-secondary);margin-top:4px;"><i class="ti ti-plus"></i> Add set</button>

        <div style="font-size:12px;font-weight:500;color:var(--text-secondary);margin-top:16px;margin-bottom:6px;">Notes</div>
        <textarea class="form-input" id="lg-notes" rows="2" style="resize:none;font-family:inherit;" placeholder="How did it feel?">${esc(state_.notes)}</textarea>

      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="window.__closeModal()">Cancel</button>
        <button class="btn-save gym" id="lg-save">${editing ? 'Save changes' : 'Save workout'}</button>
      </div>`)

    const renderSets = () => {
      const setsWrap = document.getElementById('lg-sets')
      setsWrap.innerHTML = state_.setsData.map((s,i) => `
        <div style="display:grid;grid-template-columns:32px 1fr 1fr 32px;gap:8px;align-items:center;margin-bottom:8px;">
          <div style="text-align:center;font-size:13px;font-weight:500;color:var(--text-secondary);">${i+1}</div>
          <div class="field-inline"><input type="number" min="1" data-i="${i}" data-f="reps" value="${s.reps}" /></div>
          <div class="field-inline"><input type="number" step="0.5" data-i="${i}" data-f="weight" value="${s.weight}" /></div>
          <button data-del="${i}" style="padding:6px;color:var(--text-muted);"><i class="ti ti-trash"></i></button>
        </div>`).join('')
      setsWrap.querySelectorAll('input').forEach(inp => inp.oninput = () => {
        state_.setsData[Number(inp.dataset.i)][inp.dataset.f] = parseFloat(inp.value) || 0
      })
      setsWrap.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
        if (state_.setsData.length <= 1) return toast('Need at least 1 set', true)
        state_.setsData.splice(Number(b.dataset.del), 1)
        renderSets()
      })
    }
    renderSets()

    document.querySelectorAll('.lg-group').forEach(g => g.onclick = () => {
      state_.gid = g.dataset.id
      const first = state.gym.exercises[state_.gid]?.[0]
      state_.exId = first?.id
      state_.date = document.getElementById('lg-date').value
      state_.notes = document.getElementById('lg-notes').value
      renderModal()
    })
    document.getElementById('lg-ex').onchange = e => state_.exId = e.target.value
    document.getElementById('lg-date').onchange = e => state_.date = e.target.value
    document.getElementById('lg-notes').oninput = e => state_.notes = e.target.value
    document.getElementById('lg-addset').onclick = () => {
      const last = state_.setsData[state_.setsData.length-1]
      state_.setsData.push({ reps: last?.reps || 10, weight: last?.weight || 20 })
      renderSets()
    }
    document.getElementById('lg-save').onclick = async () => {
      if (!state_.exId) return toast('Pick an exercise', true)
      if (!state_.setsData.length) return toast('Add at least one set', true)
      const validSets = state_.setsData.filter(s => s.reps > 0 && s.weight >= 0)
      if (!validSets.length) return toast('Fill in your sets', true)
      const maxSetKg = validSets.reduce((a,s) => {
        const kg = unit === 'lbs' ? lbsToKg(Number(s.weight)) : Number(s.weight)
        return Math.max(a, kg)
      }, 0)

      // PR detection: compare against previous max
      const { data: prior } = await sb.from('workout_sessions').select('max_weight_kg').eq('exercise_id', state_.exId).order('max_weight_kg', { ascending: false }).limit(1)
      const prevMax = prior?.[0]?.max_weight_kg || 0
      const isPR = !editing && maxSetKg > Number(prevMax)

      let sessionId
      if (editing) {
        await sb.from('workout_sessions').update({
          performed_on: state_.date, notes: state_.notes || null,
          max_weight_kg: maxSetKg, is_pr: session.is_pr,
        }).eq('id', session.id)
        await sb.from('workout_sets').delete().eq('session_id', session.id)
        sessionId = session.id
      } else {
        const { data: newS, error } = await sb.from('workout_sessions').insert({
          user_id: state.user.id, exercise_id: state_.exId, performed_on: state_.date,
          notes: state_.notes || null, max_weight_kg: maxSetKg, is_pr: isPR,
        }).select('id').single()
        if (error) return toast(error.message, true)
        sessionId = newS.id
      }
      const setsToInsert = validSets.map((s,i) => ({
        session_id: sessionId,
        set_number: i+1,
        reps: Math.round(Number(s.reps)),
        weight_kg: unit === 'lbs' ? lbsToKg(Number(s.weight)) : Number(s.weight),
      }))
      await sb.from('workout_sets').insert(setsToInsert)
      toast(isPR ? '🎉 New PR!' : 'Workout logged')
      closeModal()
      renderGym(root)
    }
  }
  renderModal()
}

// Go
bootstrap()
</script>

</body>
</html>
